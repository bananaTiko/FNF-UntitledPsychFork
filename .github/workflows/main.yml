name: Build

on:
  push:
    branches: [Main, Experimental, main, experimental]
  pull_request:
    branches: [Main, Experimental, main, experimental]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Install Haxelib and Setup
        run: |
          haxelib setup $RUNNER_TEMP/haxelib
          haxelib install hxcpp > /dev/null --quiet
          if [ "${{ matrix.name }}" = "Linux" ] || [ "${{ matrix.name }}" = "macOS" ]; then
            chmod +x ./setup/unix.sh
            ./setup/unix.sh
          fi
        shell: bash

      - name: Windows Setup
        if: matrix.name == 'Windows'
        run: .\setup\windows.bat
        shell: cmd

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> $RUNNER_TEMP/settings.cocoa
        shell: bash

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION
        shell: bash

      - name: Compile 64-bit
        run: |
          PLATFORM=${{ matrix.name == 'Windows' && 'windows' || matrix.name == 'Linux' && 'linux' || 'mac' }}
          haxelib run lime build Project.xml $PLATFORM \
            -D officialBuild -D HXCPP_M64 -D message.reporting=pretty -D HXCPP_GC_BIG_BLOCKS -D hscriptPos -D HXCPP_CATCH_SEGV \
            --app-version="4.0.0-${{ github.run_id }}"
        shell: bash

      - name: Compile 32-bit
        run: |
          PLATFORM=${{ matrix.name == 'Windows' && 'windows' || matrix.name == 'Linux' && 'linux' || 'mac' }}
          haxelib run lime build Project.xml $PLATFORM \
            -D officialBuild -D message.reporting=pretty -D HXCPP_GC_BIG_BLOCKS -D hscriptPos -D HXCPP_CATCH_SEGV \
            --app-version="4.0.0-${{ github.run_id }}"
        shell: bash

      - name: Upload 64-bit Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: UPF-${{ matrix.name }}-x64
          path: |
            export/release/windows/bin64
            export/release/linux/bin64
            export/release/macos/bin64

      - name: Upload 32-bit Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: UPF-${{ matrix.name }}-x86
          path: |
            export/release/windows/bin32
            export/release/linux/bin32
            export/release/macos/bin32
